name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not put vulnerabilities, credentials,
        real host details, or captured sensitive output in a public issue. See
        SECURITY.md for private reporting guidance.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps and inputs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0.dev0 or full commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Sanitized Linux distribution, Python, OpenSSH, and tmux versions

  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove addresses, usernames, fingerprints, paths, credentials, and command output.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: I removed private infrastructure details and secrets from this report.
          required: true

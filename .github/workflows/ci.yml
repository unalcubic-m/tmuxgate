name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Run isolated tests
        env:
          PYTHONPATH: src:tests
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/config
          XDG_STATE_HOME: ${{ runner.temp }}/home/state
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"
          chmod 700 "$HOME"
          python -m unittest discover -s tests -v
      - name: Compile Python and validate remote shell
        run: |
          python -m compileall -q src tests
          bash -n src/tmuxgate/assets/remote_job.sh

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install development checks
        run: python -m pip install ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          pyright
          shellcheck src/tmuxgate/assets/remote_job.sh
      - name: Coverage and immutable Actions
        env:
          PYTHONPATH: src:tests
        run: |
          coverage run -m unittest discover -s tests
          coverage report
          python -m unittest test_ci_policy -v
  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - name: Exercise installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_STATE_HOME="$HOME/state"
          mkdir -p "$XDG_CONFIG_HOME/tmuxgate" "$XDG_STATE_HOME/tmuxgate"
          chmod 700 "$HOME" "$XDG_STATE_HOME/tmuxgate"
          printf '[machines]\nexample = "example"\n' > "$XDG_CONFIG_HOME/tmuxgate/config.toml"
          chmod 600 "$XDG_CONFIG_HOME/tmuxgate/config.toml"
          tmuxgate --version
          tmuxgate --help
          tmuxgate jobs

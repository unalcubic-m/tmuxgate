name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run isolated Linux tests
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src:tests
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/config
          XDG_STATE_HOME: ${{ runner.temp }}/home/state
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"
          chmod 700 "$HOME"
          coverage run --data-file=.coverage.${{ runner.os }}.${{ matrix.python-version }} -m unittest discover -s tests -v
      - name: Run isolated native Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}/tmuxgate-profile
          APPDATA: ${{ runner.temp }}/tmuxgate-profile/AppData/Roaming
          LOCALAPPDATA: ${{ runner.temp }}/tmuxgate-profile/AppData/Local
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE, $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          coverage run --data-file=.coverage.${{ runner.os }}.${{ matrix.python-version }} -m unittest discover -s tests -v
      - name: Upload coverage counters
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}
          path: .coverage.${{ runner.os }}.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Compile Python and validate remote shell
        if: runner.os == 'Linux'
        run: |
          python -m compileall -q src tests
          bash -n src/tmuxgate/assets/remote_job.sh
      - name: Compile native Windows Python
        if: runner.os == 'Windows'
        run: python -m compileall -q src tests

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install development checks
        run: python -m pip install ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          pyright
          shellcheck src/tmuxgate/assets/remote_job.sh
      - name: Coverage and immutable Actions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combined Linux and Windows coverage and immutable Actions
        env:
          PYTHONPATH: src:tests
        run: |
          coverage combine
          coverage report
          python -m unittest test_ci_policy -v
  package:
    name: Package smoke test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - name: Exercise installed CLI outside the checkout
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_STATE_HOME="$HOME/state"
          mkdir -p "$XDG_CONFIG_HOME/tmuxgate" "$XDG_STATE_HOME/tmuxgate"
          chmod 700 "$HOME" "$XDG_STATE_HOME/tmuxgate"
          printf '[machines]\nexample = "example"\n' > "$XDG_CONFIG_HOME/tmuxgate/config.toml"
          chmod 600 "$XDG_CONFIG_HOME/tmuxgate/config.toml"
          tmuxgate --version
          tmuxgate --help
          tmuxgate jobs
      - name: Exercise installed Windows CLI outside the checkout
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'tmuxgate-smoke/config'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'tmuxgate-smoke/state'
          @'
          from tmuxgate.config import default_config_path
          p = default_config_path()
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('[machines]\nexample = "never-contact.invalid"\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tmuxgate --version
          tmuxgate --help
          tmuxgate jobs

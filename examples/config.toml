# All addresses in this file are RFC 5737 documentation ranges.
# Replace every example alias, address, user, and SSH profile before use.
version = 2

[broker]
max_active_remote_commands = 3
max_open_ssh_masters = 3
max_pending_requests = 16
queue_policy = "fifo"
ssh_master_idle_timeout_seconds = 600
approval_mode = "always"

[mcp]
host = "127.0.0.1"
port = 8765

[contexts.home]
gateway = "192.0.2.1"
source_cidr = "192.0.2.0/24"

# Enroll complete fingerprints while physically connected to the trusted
# network. Without a fingerprint, the home endpoint remains ineligible.
fingerprints = []

[contexts.wireguard]
local_addresses = ["198.51.100.3/32"]
remote_cidrs = ["198.51.100.128/25"]

[machines.app-server]
description = "Example application server"
enabled = true
ssh_profile = "app-server"
user = "operator"
host_key_alias = "tmuxgate-app-server"
connect_timeout_seconds = 6

[[machines.app-server.endpoints]]
id = "home-lan"
address = "192.0.2.20"
port = 22
priority = 10
requires = "home"

[[machines.app-server.endpoints]]
id = "wireguard"
address = "198.51.100.200"
port = 22
priority = 20
requires = "wireguard"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxgate"
version = "0.1.0.dev1"
description = "Minimal automatic SSH executor using one remote tmux session per job"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Unal"}]
keywords = ["ssh", "tmux", "remote-execution", "automation", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp==2.0.0",
    "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "coverage[toml]==7.15.3",
    "pyright==1.1.411",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/unalcubic-m/tmuxgate"
Documentation = "https://github.com/unalcubic-m/tmuxgate/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/unalcubic-m/tmuxgate/issues"
Repository = "https://github.com/unalcubic-m/tmuxgate.git"

[project.scripts]
tmuxgate = "tmuxgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmuxgate = ["assets/*.sh", "assets/*.service"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src/tmuxgate", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.coverage.run]
branch = true
source = ["tmuxgate"]

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = true
skip_covered = true
